services:
  store-service:
    image: simplex-store-service:latest
    build:
      context: ../..
      dockerfile: scripts/store-service/Dockerfile
      target: runtime
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    restart: unless-stopped
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    tty: true
    network_mode: host
    command:
      - "-d"
      - "${BADGE_DB_CONN:-postgresql://simplex@127.0.0.1:5432/badge_service}"
      - "--create-schema"
      - "--yes-migrate"
      - "--service-config"
      - "/etc/simplex-store-service/store_service.ini"
    volumes:
      - type: bind
        source: ./config
        target: /etc/simplex-store-service
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 10s

  webapps:
    image: simplex-store-webapps:latest
    build:
      context: ../..
      dockerfile: scripts/store-service/Dockerfile
      target: webapps
    restart: "no"
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    network_mode: none
    volumes:
      - type: bind
        source: ./badges
        target: /out/badges
        bind:
          create_host_path: false
      - type: bind
        source: ./names
        target: /out/names
        bind:
          create_host_path: false
