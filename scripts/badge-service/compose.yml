services:
  badge-service:
    image: simplex-badge-service:latest
    build:
      context: ../..
      dockerfile: scripts/badge-service/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    restart: on-failure:5
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    tty: true
    network_mode: host
    command:
      - "-d"
      - "${BADGE_DB_CONN:-postgresql://simplex@127.0.0.1:5432/badge_service}"
      - "--create-schema"
      - "--yes-migrate"
      - "--service-config"
      - "/etc/simplex-badge-service/badge_service.ini"
    volumes:
      - type: bind
        source: ./badge_service.ini
        target: /etc/simplex-badge-service/badge_service.ini
        read_only: true
        bind:
          create_host_path: false
      # - type: bind
      #   source: ./AppleRootCA-G3.cer
      #   target: /etc/simplex-badge-service/AppleRootCA-G3.cer
      #   read_only: true
      #   bind:
      #     create_host_path: false
      # - type: bind
      #   source: ./play-service-account.json
      #   target: /etc/simplex-badge-service/play-service-account.json
      #   read_only: true
      #   bind:
      #     create_host_path: false
      - ./web:/srv/webapp
    stop_grace_period: 10s
