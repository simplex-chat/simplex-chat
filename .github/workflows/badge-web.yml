name: badge web

on:
  push:
    branches:
      - master
      - stable
    paths:
      - "apps/simplex-badge-service/web/**"
      - ".github/workflows/badge-web.yml"
  pull_request:
    paths:
      - "apps/simplex-badge-service/web/**"
      - ".github/workflows/badge-web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simplex-badge-service/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/simplex-badge-service/web/package-lock.json

      - run: npm ci

      - run: npm test
