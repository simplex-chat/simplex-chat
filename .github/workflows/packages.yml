name: packages

# Releases simplex-chat (npm, PyPI) and @simplex-chat/types (npm) from master and stable:
# 1. A missing Node.js add-on release (nodejs-addon-<hash of its sources>) is built and uploaded to simplex-chat-libs.
# 2. Versions that are not published yet are published, and tagged <package>-v<version> on their commit.
#    npm prerelease versions get dist-tag beta, others latest.
# 3. The release PR packages-release/<branch> pins new library and add-on releases with their SHA-256
#    and bumps the versions of changed packages. Merging it publishes them (step 2).
# Pull requests that change the add-on only build it.

# Publishing uses trusted publishing (OIDC) for this workflow on npm and PyPI,
# or the NPM_TOKEN and PYPI_API_TOKEN secrets when they are set.
# Test repositories: variables NPM_SCOPE, PYPI_PROJECT and PYPI_URL / PYPI_UPLOAD_URL (TestPyPI)
# publish under other names.

# Secrets:
# -------
# NODEJS_REPO_TOKEN
#  Only select repositories: simplex-chat-libs
#  Permissions:
#   * Contents (Read and Write)
# RELEASE_PR_TOKEN
#  Only select repositories: simplex-chat
#  Permissions:
#   * Contents (Read and Write)
#   * Pull requests (Read and Write)
#  A PR opened with GITHUB_TOKEN does not run the checks of other workflows.

on:
  workflow_dispatch:
    inputs:
      nodejs_version:
        description: "simplex-chat npm version, bumped when needed by default"
        required: false
      types_version:
        description: "@simplex-chat/types version, bumped when needed by default"
        required: false
      python_version:
        description: "simplex-chat PyPI version, bumped when needed by default"
        required: false
  # build.yml, after a library release
  workflow_call:
  push:
    branches:
      - master
      - stable
    paths:
      - "packages/simplex-chat-nodejs/**"
      - "packages/simplex-chat-client/types/typescript/**"
      - "packages/simplex-chat-python/**"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/simplex-chat-nodejs/cpp/**"
      - "packages/simplex-chat-nodejs/binding.gyp"
      - ".github/workflows/packages.yml"

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NPM_SCOPE: ${{ vars.NPM_SCOPE }}
  PYPI_PROJECT: ${{ vars.PYPI_PROJECT }}
  PYPI_URL: ${{ vars.PYPI_URL }}

jobs:
  addon:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release_branch: ${{ steps.branch.outputs.release_branch }}
      missing: ${{ steps.release.outputs.missing }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Add-on release tag
        id: tag
        run: echo "tag=$(python3 scripts/ci/packages_release.py addon-tag)" >> "$GITHUB_OUTPUT"

      - name: Release branch
        id: branch
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/stable')
        run: echo "release_branch=true" >> "$GITHUB_OUTPUT"

      - name: Check the add-on release
        id: release
        if: steps.branch.outputs.release_branch
        env:
          GH_TOKEN: ${{ secrets.NODEJS_REPO_TOKEN }}
          LIBS_REPOSITORY: ${{ github.repository }}-libs
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$LIBS_REPOSITORY" > /dev/null 2>&1; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  addon-build:
    name: "addon-build ${{ matrix.platform }}"
    needs: addon
    if: github.event_name == 'pull_request' || needs.addon.outputs.missing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
          - os: macos-latest
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
        working-directory: packages/simplex-chat-nodejs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build add-on
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx --yes node-gyp rebuild
          cp build/Release/simplex.node build/simplex-chat-nodejs-${{ matrix.platform }}.node

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplex-nodejs-addon-${{ matrix.platform }}
          path: packages/simplex-chat-nodejs/build/simplex-chat-nodejs-${{ matrix.platform }}.node
          if-no-files-found: error

  publish:
    needs: addon
    if: needs.addon.outputs.release_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Versions to publish
        id: plan
        run: python3 scripts/ci/packages_release.py publish-plan >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.plan.outputs.types_version || steps.plan.outputs.nodejs_version
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        if: steps.plan.outputs.python_version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Before the test names: the build installs @simplex-chat/types from this repository.
      - name: Build and test simplex-chat (npm)
        if: steps.plan.outputs.nodejs_version
        working-directory: packages/simplex-chat-nodejs
        run: |
          (cd ../simplex-chat-client/types/typescript && npm install --no-audit --no-fund && npx tsc)
          npm install --ignore-scripts --no-save --no-audit --no-fund ../simplex-chat-client/types/typescript
          npx tsc && cp src/simplex.* dist
          npx jest tests/libs.test.ts tests/api.unit.test.ts

      - name: Use test package names
        if: vars.NPM_SCOPE || vars.PYPI_PROJECT
        run: python3 scripts/ci/packages_release.py test-names

      - name: Publish @simplex-chat/types
        if: steps.plan.outputs.types_version
        working-directory: packages/simplex-chat-client/types/typescript
        env:
          VERSION: ${{ steps.plan.outputs.types_version }}
          DIST_TAG: ${{ steps.plan.outputs.types_dist_tag }}
        run: |
          npm install --no-audit --no-fund
          npm publish --provenance --access public --tag "$DIST_TAG"
          git tag "types-v$VERSION" && git push origin "types-v$VERSION"

      - name: Publish simplex-chat (npm)
        if: steps.plan.outputs.nodejs_version
        working-directory: packages/simplex-chat-nodejs
        env:
          VERSION: ${{ steps.plan.outputs.nodejs_version }}
          DIST_TAG: ${{ steps.plan.outputs.nodejs_dist_tag }}
        run: |
          npm publish --provenance --access public --tag "$DIST_TAG"
          git tag "nodejs-v$VERSION" && git push origin "nodejs-v$VERSION"

      - name: Build and test simplex-chat (PyPI)
        if: steps.plan.outputs.python_version
        working-directory: packages/simplex-chat-python
        run: |
          python -m pip install build -e ".[test]"
          python -m pytest -q
          python -m build

      - name: Publish simplex-chat (PyPI)
        if: steps.plan.outputs.python_version
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/simplex-chat-python/dist
          repository-url: ${{ vars.PYPI_UPLOAD_URL || 'https://upload.pypi.org/legacy/' }}
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Tag the published PyPI version
        if: steps.plan.outputs.python_version
        env:
          VERSION: ${{ steps.plan.outputs.python_version }}
        run: git tag "python-v$VERSION" && git push origin "python-v$VERSION"

  release:
    # After publish, for its version tags. A failed publish leaves its versions unbumped.
    needs: [addon, addon-build, publish]
    # A merged release PR changes only versions and pins.
    if: >-
      !cancelled() && needs.addon.outputs.release_branch && needs.addon-build.result != 'failure'
      && !startsWith(github.event.head_commit.message, 'packages: release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Outside the checkout: the release PR commits every change in it.
      - name: Download add-on artifacts
        if: needs.addon.outputs.missing
        uses: actions/download-artifact@v4
        with:
          pattern: simplex-nodejs-addon-*
          merge-multiple: true
          path: ${{ runner.temp }}/addons

      - name: Create add-on release
        if: needs.addon.outputs.missing
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}-libs
          tag_name: ${{ needs.addon.outputs.tag }}
          files: ${{ runner.temp }}/addons/*.node
          token: ${{ secrets.NODEJS_REPO_TOKEN }}

      - name: Update pins and versions
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.NODEJS_REPO_TOKEN }}
          LIBS_REPOSITORY: ${{ github.repository }}-libs
          NODEJS_VERSION: ${{ inputs.nodejs_version }}
          TYPES_VERSION: ${{ inputs.types_version }}
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          python3 scripts/ci/packages_release.py prepare \
            --nodejs-version "$NODEJS_VERSION" \
            --types-version "$TYPES_VERSION" \
            --python-version "$PYTHON_VERSION" \
            --summary "$RUNNER_TEMP/summary.md"
          echo "title=$(head -n 1 "$RUNNER_TEMP/summary.md")" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          branch: packages-release/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          title: ${{ steps.prepare.outputs.title }}
          commit-message: ${{ steps.prepare.outputs.title }}
          body-path: ${{ runner.temp }}/summary.md
          author: SimpleX Chat <build@simplex.chat>
          committer: SimpleX Chat <build@simplex.chat>
          delete-branch: true
