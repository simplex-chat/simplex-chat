name: apps

on:
  push:
    branches:
      - master
      - stable
    paths:
      - "apps/multiplatform/**"
      - "apps/ios/**"
      - "scripts/ci/ios-stub-libs.sh"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "apps/multiplatform/**"
      - "apps/ios/**"
      - "scripts/ci/ios-stub-libs.sh"
      - ".github/workflows/apps.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VER: 17

jobs:
  kotlin:
    name: "Kotlin (Android, Desktop)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VER }}
          cache: 'gradle'

      - name: Build and test
        working-directory: apps/multiplatform
        # Compiling the desktop and Android targets of :common in parallel exceeds the 2 GB Kotlin daemon heap.
        # cmakeBuildAndCopy links the JNI library against libsimplex, which this workflow does not build.
        run: |
          ./gradlew --no-daemon --max-workers=1 \
            :common:desktopTest \
            :desktop:compileKotlinJvm -x :desktop:cmakeBuildAndCopy \
            :android:compileGoogleDebugKotlin \
            :android:testFossDebugUnitTest

  ios:
    name: "iOS"
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create stub core libraries
        run: scripts/ci/ios-stub-libs.sh

      - name: Build
        run: |
          xcodebuild build \
            -project apps/ios/SimpleX.xcodeproj \
            -scheme "SimpleX (iOS)" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO
