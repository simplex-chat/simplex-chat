name: ios-sim

on:
  workflow_dispatch:
    inputs:
      claude:
        description: Also run the Claude session
        type: boolean
        default: false
      backend:
        description: Start the test backend
        type: boolean
        default: false
      calls:
        description: Test video calls between two simulators, this branch's app with itself and with another ref's
        type: boolean
        default: false
      calls_with:
        description: The other ref's app for the call test, built with this branch's core library
        type: string
        default: master
      apps_run:
        description: Only test calls, with the two apps of this earlier run of ios-sim (its id), not built again
        type: string
        default: ""
      calls_android:
        description: Test video calls between this branch's iOS app and Android app, in an emulator on another runner
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true

env:
  GHC_VER: 9.6.3
  CABAL_VER: 3.10.2.0
  CORE_PKG: pkg-ios-aarch64-swift-json.zip
  BACKEND_PKG: ios-sim-backend.zip
  ANDROID_CORE_PKG: android-core-arm64-v8a.tar.gz
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # newer images add Command Line Tools whose macOS SDK the default Xcode's linker cannot read
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  plan:
    name: choose jobs, find earlier builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run-claude: ${{ steps.jobs.outputs.claude }}
      run-backend: ${{ steps.jobs.outputs.backend }}
      claude-backend: ${{ steps.scope.outputs.backend }}
      core: ${{ steps.names.outputs.core }}
      core-run: ${{ steps.core.outputs.run-id }}
      backend: ${{ steps.names.outputs.backend }}
      backend-run: ${{ steps.backend.outputs.run-id }}
      android-core: ${{ steps.names.outputs.android-core }}
      android-core-run: ${{ steps.android-core.outputs.run-id }}
    steps:
      - name: Choose jobs
        id: jobs
        env:
          CLAUDE: ${{ inputs.claude }}
          BACKEND: ${{ inputs.backend }}
        run: |
          echo "claude=$CLAUDE" | tee -a "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Claude scope
        id: scope
        if: steps.jobs.outputs.claude == 'true'
        env:
          BACKEND: ${{ steps.jobs.outputs.backend }}
        run: |
          backend=$(sed -n 's/^backend: *//p' scripts/ci/ios-sim/claude-scope)
          case "$backend" in
            yes | no) echo "backend=$backend" | tee -a "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::claude-scope must say backend: yes or backend: no"
              exit 1
              ;;
          esac
          if [ "$backend" = yes ] && [ "$BACKEND" != true ]; then
            echo "::error::claude-scope says the Claude sessions use the test backend: ask for it too"
            exit 1
          fi

      # artifacts are named after the sources they are built from, so a run uses one that an earlier run uploaded
      - name: Artifact names
        id: names
        run: |
          echo "core=ios-sim-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'scripts/ci/ios-sim/build-core.sh') }}" >> "$GITHUB_OUTPUT"
          echo "backend=ios-sim-backend-${{ hashFiles('src/**', 'apps/simplex-chat/**', 'apps/simplex-directory-service/Main.hs', 'apps/simplex-directory-service/src/**', 'cabal.project', 'simplex-chat.cabal', 'scripts/ci/ios-sim/build-backend.sh') }}" >> "$GITHUB_OUTPUT"
          echo "android-core=android-core-${{ hashFiles('src/**', 'cabal.project', 'simplex-chat.cabal', 'PRIVACY.md', 'flake.nix', 'flake.lock', 'scripts/nix/**', 'scripts/ci/android/build-core.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Find core library
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/ios-sim/earlier-run.sh "${{ steps.names.outputs.core }}"

      - name: Find backend
        id: backend
        if: steps.jobs.outputs.backend == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/ios-sim/earlier-run.sh "${{ steps.names.outputs.backend }}"

      - name: Find Android core library
        id: android-core
        if: inputs.calls_android
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/ios-sim/earlier-run.sh "${{ steps.names.outputs.android-core }}"

  app:
    name: app in the iOS simulator
    needs: plan
    if: inputs.apps_run == ''
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      app: ${{ steps.upload-app.outcome }}
      other-app: ${{ steps.upload-other-app.outcome }}
    env:
      START_BACKEND: ${{ needs.plan.outputs.run-backend }}
      BUILD_CORE: ${{ needs.plan.outputs.core-run == '' }}
      BUILD_BACKEND: ${{ needs.plan.outputs.run-backend == 'true' && needs.plan.outputs.backend-run == '' }}
      CALLS: ${{ inputs.calls }}
      CALLS_WITH: ${{ inputs.calls_with }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          xcodebuild -version
          xcrun --show-sdk-path
          ls /Library/Developer/CommandLineTools/SDKs || true
          xcrun simctl list runtimes

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Setup Haskell
        if: env.BUILD_CORE == 'true' || env.BUILD_BACKEND == 'true'
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ env.GHC_VER }}
          cabal-version: ${{ env.CABAL_VER }}

      - name: Install libraries
        if: env.BUILD_CORE == 'true'
        run: brew install openssl@3 libffi gmp

      - name: Build core library
        if: env.BUILD_CORE == 'true'
        run: scripts/ci/ios-sim/build-core.sh ~/Downloads/${{ env.CORE_PKG }}

      - name: Upload core library
        if: env.BUILD_CORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.core }}
          path: ~/Downloads/${{ env.CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download core library
        if: env.BUILD_CORE != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.core }}
          path: ~/Downloads
          run-id: ${{ needs.plan.outputs.core-run }}
          github-token: ${{ github.token }}

      - name: Prepare libraries
        run: |
          scripts/ci/ios-sim/prepare-libs.sh
          scripts/ios/update-pbxproj.sh

      - name: Build backend
        if: env.BUILD_BACKEND == 'true'
        run: scripts/ci/ios-sim/build-backend.sh ~/Downloads/${{ env.BACKEND_PKG }}

      - name: Upload backend
        if: env.BUILD_BACKEND == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.backend }}
          path: ~/Downloads/${{ env.BACKEND_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Download backend
        if: env.START_BACKEND == 'true' && env.BUILD_BACKEND != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.backend }}
          path: ~/Downloads
          run-id: ${{ needs.plan.outputs.backend-run }}
          github-token: ${{ github.token }}

      - name: Start test backend
        if: env.START_BACKEND == 'true'
        timeout-minutes: 30
        run: scripts/ci/ios-sim/backend.sh start ~/Downloads/${{ env.BACKEND_PKG }} "$RUNNER_TEMP/backend"

      # the simulator has no camera: the app sends sounds/video.mp4 in its place
      - name: Make test video
        run: swift scripts/ci/ios-sim/test-video.swift apps/ios/sounds/video.mp4

      - name: Build app
        id: build
        run: scripts/ci/ios-sim/build-app.sh "$RUNNER_TEMP/DerivedData"

      # a tarball keeps the app's file modes, which an artifact drops
      - name: Pack app
        run: tar -czf "$RUNNER_TEMP/SimpleX.app.tar.gz" -C "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" SimpleX.app

      - name: Upload app
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}/SimpleX.app.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Build the other ref's app
        id: other-app
        if: env.CALLS == 'true'
        run: |
          scripts/ci/ios-sim/build-app.sh "$RUNNER_TEMP/DerivedData-other" "$CALLS_WITH"
          tar -czf "$RUNNER_TEMP/SimpleX-other.app.tar.gz" -C "$RUNNER_TEMP/DerivedData-other/Build/Products/Debug-iphonesimulator" SimpleX.app

      - name: Upload the other ref's app
        id: upload-other-app
        if: steps.other-app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-other-app
          path: ${{ runner.temp }}/SimpleX-other.app.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Test calls between two call clients
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: scripts/ci/ios-sim/call-xctest.sh "$RUNNER_TEMP/DerivedData" "$RUNNER_TEMP/call-test/xctest"

      # the tests after the call tests run whenever the app built: each checks something else
      - name: Install AXe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci/ios-sim/install-axe.sh

      - name: Run smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/ci/ios-sim/smoke-test.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/SimpleX.app" "$RUNNER_TEMP/smoke-test" images

      - name: Stop test backend
        if: ${{ !cancelled() && env.START_BACKEND == 'true' }}
        run: scripts/ci/ios-sim/backend.sh stop "$RUNNER_TEMP/backend"

      - name: Upload call test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-call-test
          path: ${{ runner.temp }}/call-test
          retention-days: 3
          if-no-files-found: warn

      - name: Upload smoke test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-smoke-test
          path: ${{ runner.temp }}/smoke-test
          retention-days: 3
          if-no-files-found: warn

      - name: Upload backend logs
        if: ${{ !cancelled() && env.START_BACKEND == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-backend-logs
          path: |
            ${{ runner.temp }}/backend/*.log
            ${{ runner.temp }}/backend/seed.md
          retention-days: 3
          if-no-files-found: warn

  calls:
    name: calls between ${{ matrix.peers }}
    needs: app
    if: ${{ !cancelled() && inputs.calls && (inputs.apps_run != '' || needs.app.outputs.other-app == 'success') }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - peers: branch-branch
            alice: branch
            bob: branch
            fixed: alice bob
          - peers: branch-other
            alice: branch
            bob: other
            fixed: alice
          - peers: other-other
            alice: other
            bob: other
            fixed: ""
    env:
      ALICE: ${{ matrix.alice }}
      BOB: ${{ matrix.bob }}
      FIXED: ${{ matrix.fixed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Download this branch's app
        uses: actions/download-artifact@v8
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}/branch
          run-id: ${{ inputs.apps_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download the other ref's app
        uses: actions/download-artifact@v8
        with:
          name: ios-sim-other-app
          path: ${{ runner.temp }}/other
          run-id: ${{ inputs.apps_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack apps
        run: |
          tar -xzf "$RUNNER_TEMP/branch/SimpleX.app.tar.gz" -C "$RUNNER_TEMP/branch"
          tar -xzf "$RUNNER_TEMP/other/SimpleX-other.app.tar.gz" -C "$RUNNER_TEMP/other"

      - name: Install AXe
        run: scripts/ci/ios-sim/install-axe.sh

      - name: Test calls
        run: scripts/ci/ios-sim/call-test.sh "$RUNNER_TEMP/$ALICE/SimpleX.app" "$RUNNER_TEMP/$BOB/SimpleX.app" "$RUNNER_TEMP/call-test" "$FIXED"

      - name: Upload call test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-call-test-${{ matrix.peers }}
          path: ${{ runner.temp }}/call-test
          retention-days: 3
          if-no-files-found: warn

  android-core:
    name: core library for Android arm64
    needs: plan
    if: inputs.calls_android && needs.plan.outputs.android-core-run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Build core library
        run: scripts/ci/android/build-core.sh ~/core/${{ env.ANDROID_CORE_PKG }}

      - name: Upload core library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.android-core }}
          path: ~/core/${{ env.ANDROID_CORE_PKG }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

  ios-calls-android:
    name: iOS app calls the Android app
    needs: [plan, app]
    if: ${{ !cancelled() && inputs.calls_android && (inputs.apps_run != '' || needs.app.outputs.app == 'success') }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}/branch
          run-id: ${{ inputs.apps_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack app
        run: tar -xzf "$RUNNER_TEMP/branch/SimpleX.app.tar.gz" -C "$RUNNER_TEMP/branch"

      - name: Install AXe
        run: scripts/ci/ios-sim/install-axe.sh

      - name: Start the iPhone and make its link
        run: scripts/ci/ios-sim/call-android-test.sh link "$RUNNER_TEMP/branch/SimpleX.app" "$RUNNER_TEMP/call-test"

      - name: Pass the link to the Android job
        uses: actions/upload-artifact@v7
        with:
          name: ios-call-link
          path: ${{ runner.temp }}/call-test/link
          retention-days: 1
          if-no-files-found: error

      - name: Test calls with the Android app
        run: scripts/ci/ios-sim/call-android-test.sh calls "$RUNNER_TEMP/call-test"

      - name: Upload call test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-call-test-android-ios
          path: ${{ runner.temp }}/call-test
          retention-days: 3
          if-no-files-found: warn

  android-calls-ios:
    name: Android app calls the iOS app
    needs: [plan, android-core]
    if: ${{ !cancelled() && !failure() && inputs.calls_android && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      APK: android-foss-arm64-v8a-debug.apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libegl1

      - name: Download core library
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.android-core }}
          path: ~/core
          run-id: ${{ needs.plan.outputs.android-core-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install core library
        run: scripts/ci/android/install-core.sh ~/core/${{ env.ANDROID_CORE_PKG }}

      - name: Build the call page
        working-directory: packages/simplex-chat-webrtc
        run: |
          npm install --no-audit --no-fund
          npm run build
          git diff --stat -- ../../apps/multiplatform/common/src/commonMain/resources/assets/www

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17

      - name: Build app
        working-directory: apps/multiplatform
        run: |
          ./gradlew --no-daemon --console=plain -Psimplex.assets.dir=../../assets -Pandroid.injected.build.abi=arm64-v8a :android:assembleFossDebug
          mkdir -p "$RUNNER_TEMP/apk"
          cp "android/build/intermediates/apk/foss/debug/$APK" "$RUNNER_TEMP/apk"

      - name: Install emulator and system image
        run: scripts/ci/android/install-sdk.sh "$RUNNER_TEMP/android-sdk"

      - name: Boot emulator
        env:
          EMULATOR_CAMERA: emulated
        run: scripts/ci/android/emulator.sh start "$RUNNER_TEMP/android-call"

      - name: Onboard
        run: scripts/ci/android/smoke-test.sh "$RUNNER_TEMP/apk/$APK" "$RUNNER_TEMP/android-call" onboarding

      - name: Wait for the iPhone's link
        timeout-minutes: 150
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=ios-call-link" --jq '.artifacts[0].id // empty') && [ -n "$id" ]; do
            sleep 30
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/link.zip"
          unzip -o "$RUNNER_TEMP/link.zip" -d "$RUNNER_TEMP/link"
          cat "$RUNNER_TEMP/link/link"

      - name: Test calls with the iOS app
        run: scripts/ci/android/call-peer.sh "$(cat "$RUNNER_TEMP/link/link")" "$RUNNER_TEMP/android-call"

      - name: Upload call test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-call-test
          path: ${{ runner.temp }}/android-call
          retention-days: 3
          if-no-files-found: warn

  # The app-sim-claude environment's branch rule decides which branches may use the token.
  claude:
    name: Claude tests the iOS app
    needs: [plan, app]
    if: ${{ !cancelled() && needs.plan.outputs.run-claude == 'true' && needs.app.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 330
    environment:
      name: app-sim-claude
      deployment: false
    concurrency:
      group: ios-sim-claude-${{ github.ref }}
      cancel-in-progress: true
    env:
      # the same in both app workflows
      CLAUDE_CODE_VERSION: 2.1.300
    steps:
      # the job holds the Claude token, so the checkout's GitHub token is not left in .git/config
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show runner
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Use the macOS 26 SDK
        run: scripts/ci/ios-sim/use-macos26-sdk.sh

      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: ios-sim-app
          path: ${{ runner.temp }}

      - name: Unpack app
        run: tar -xzf "$RUNNER_TEMP/SimpleX.app.tar.gz" -C "$RUNNER_TEMP"

      - name: Download backend
        if: needs.plan.outputs.claude-backend == 'yes'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.backend }}
          path: ~/Downloads
          run-id: ${{ needs.plan.outputs.backend-run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Start test backend
        id: backend
        if: needs.plan.outputs.claude-backend == 'yes'
        timeout-minutes: 30
        run: scripts/ci/ios-sim/backend.sh start ~/Downloads/${{ env.BACKEND_PKG }} "$RUNNER_TEMP/backend"

      - name: Install AXe
        run: scripts/ci/ios-sim/install-axe.sh

      - name: Run smoke test
        run: scripts/ci/ios-sim/smoke-test.sh "$RUNNER_TEMP/SimpleX.app" "$RUNNER_TEMP/claude-test/smoke-test"

      - name: Add test images
        run: |
          images=(tests/fixtures/test.jpg tests/fixtures/logo-large-rgba.png)
          if sips -r 90 -s format heic tests/fixtures/test.jpg --out "$RUNNER_TEMP/test-card-portrait.heic"; then
            images+=("$RUNNER_TEMP/test-card-portrait.heic")
          fi
          xcrun simctl addmedia "$SIM_UDID" "${images[@]}"

      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version

      - name: Run the device test plan with Claude
        timeout-minutes: 240
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BACKEND_DIR: ${{ steps.backend.outcome == 'success' && format('{0}/backend', runner.temp) || '' }}
        run: scripts/ci/ios-sim/claude-test.sh "$RUNNER_TEMP/claude-test"

      - name: Report Claude usage
        if: ${{ always() }}
        run: scripts/ci/ios-sim/claude-usage.sh "$RUNNER_TEMP/claude-test"

      - name: Stop test backend
        if: ${{ !cancelled() && steps.backend.outcome != 'skipped' }}
        run: scripts/ci/ios-sim/backend.sh stop "$RUNNER_TEMP/backend"

      - name: Upload Claude test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-claude-test
          path: ${{ runner.temp }}/claude-test
          retention-days: 14
          if-no-files-found: warn

      - name: Upload backend logs
        if: ${{ !cancelled() && steps.backend.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim-claude-backend-logs
          path: |
            ${{ runner.temp }}/backend/*.log
            ${{ runner.temp }}/backend/seed.md
          retention-days: 3
          if-no-files-found: warn
