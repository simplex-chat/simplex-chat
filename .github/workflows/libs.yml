name: libs

# Secrets:
# -------
# NODEJS_REPO_TOKEN
#  Only select repositories: simplex-chat-libs
#  Permissions:
#   * Contents (Read and Write)

on:
  push:
    branches:
      - master
      - stable

concurrency:
  group: libs
  cancel-in-progress: false

env:
  GHC_VER: 9.6.3
  JAVA_VER: 17

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NODEJS_REPO_TOKEN }}
        run: |
          version=$(sed -n 's/^version: *//p' simplex-chat.cabal)
          echo "version=$version" >> $GITHUB_OUTPUT
          if gh release view "core-$version" --repo "${{ github.repository }}-libs" > /dev/null; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

  build-linux:
    name: "ubuntu-22.04-${{ matrix.arch }}${{ matrix.suffix }}"
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            hash: 'sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5'
            backend: sqlite
            suffix: ''
          - arch: x86_64
            runner: ubuntu-22.04
            hash: 'sha256:5c8b2c0a6c745bc177669abfaa716b4bc57d58e2ea3882fb5da67f4d59e3dda5'
            backend: postgres
            suffix: '-postgres'
          - arch: aarch64
            runner: ubuntu-22.04-arm
            hash: 'sha256:6a62a4157b8775eaf4959cb629e757d32d39d1f4c8ac1b0ddc2510b555cf72f3'
            backend: sqlite
            suffix: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Get UID and GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> $GITHUB_OUTPUT
          echo "gid=$(id -g)" >> $GITHUB_OUTPUT

      - name: Free disk space
        shell: bash
        run: ./scripts/ci/linux_util_free_space.sh

      - name: Restore cached build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: libs-ubuntu-22.04-${{ matrix.arch }}-${{ matrix.backend }}-ghc${{ env.GHC_VER }}-${{ hashFiles('cabal.project', 'simplex-chat.cabal') }}

      - name: Set up Docker Buildx
        uses: simplex-chat/docker-setup-buildx-action@v3

      - name: Build and cache Docker image
        uses: simplex-chat/docker-build-push-action@v6
        with:
          context: .
          load: true
          file: Dockerfile.build
          tags: build/22.04:latest
          build-args: |
            TAG=22.04
            HASH=${{ matrix.hash }}
            GHC=${{ env.GHC_VER }}
            USER_UID=${{ steps.ids.outputs.uid }}
            USER_GID=${{ steps.ids.outputs.gid }}

      - name: Start container
        shell: bash
        run: |
          docker run -t -d \
            --name builder \
            -v ~/.cabal:/root/.cabal \
            -v /home/runner/work/_temp:/home/runner/work/_temp \
            -v ${{ github.workspace }}:/project \
            build/22.04:latest

      - name: Prepare cabal.project.local
        shell: bash
        run: |
          echo "ignore-project: False"    >> cabal.project.local
          echo "package direct-sqlcipher" >> cabal.project.local
          echo "    flags: +openssl"      >> cabal.project.local

      - name: Build library
        shell: docker exec -t builder sh -eu {0}
        run: |
          cabal clean
          cabal update
          SKIP_VLC=1 scripts/desktop/build-lib-linux.sh ${{ matrix.backend }}

      - name: Prepare libraries
        shell: bash
        run: |
          mkdir -p release-libs/libs
          find apps/multiplatform/common/src/commonMain/cpp/desktop/libs/linux-${{ matrix.arch }} -maxdepth 1 -type f -exec cp {} release-libs/libs/ \;

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-libs-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: release-libs

      - name: Fix permissions for cache
        shell: bash
        run: |
          sudo chmod -R 777 dist-newstyle ~/.cabal
          sudo chown -R $(id -u):$(id -g) dist-newstyle ~/.cabal

  build-macos:
    name: "macos-${{ matrix.arch }}"
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
            openssl_dir: /opt/homebrew/opt
          - arch: x86_64
            runner: macos-15-intel
            openssl_dir: /usr/local/opt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ env.JAVA_VER }}
          ghc_ver: ${{ env.GHC_VER }}
          os: ${{ matrix.runner }}
          github_ref: ${{ github.ref }}

      - name: Install OpenSSL
        run: brew install openssl@3.0

      - name: Prepare cabal.project.local
        shell: bash
        run: |
          echo "ignore-project: False"                                                    >> cabal.project.local
          echo "package simplexmq"                                                        >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/lib"            >> cabal.project.local
          echo ""                                                                         >> cabal.project.local
          echo "package direct-sqlcipher"                                                 >> cabal.project.local
          echo "    extra-include-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/include"    >> cabal.project.local
          echo "    extra-lib-dirs: ${{ matrix.openssl_dir }}/openssl@3.0/lib"            >> cabal.project.local
          echo "    flags: +openssl"                                                      >> cabal.project.local

      - name: Build library
        shell: bash
        run: |
          cabal update
          SKIP_VLC=1 scripts/desktop/build-lib-mac.sh

      - name: Prepare libraries
        shell: bash
        run: |
          mkdir -p release-libs/libs
          find apps/multiplatform/common/src/commonMain/cpp/desktop/libs/mac-${{ matrix.arch }} -maxdepth 1 -type f -exec cp {} release-libs/libs/ \;

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-libs-macos-${{ matrix.arch }}
          path: release-libs

  build-windows:
    name: "windows-x86_64"
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Prepare build
        uses: ./.github/actions/prepare-build
        with:
          java_ver: ${{ env.JAVA_VER }}
          ghc_ver: ${{ env.GHC_VER }}
          os: windows-latest
          cache_path: "C:/cabal"
          github_ref: ${{ github.ref }}

      - name: Configure pagefile (Windows)
        uses: simplex-chat/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: 'Setup MSYS2'
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            perl
            make
          pacboy: >-
            toolchain:p
            cmake:p

      - name: Build library
        shell: msys2 {0}
        run: |
          export PATH=$PATH:/c/ghcup/bin:$(echo /c/tools/ghc-*/bin || echo)
          cabal update
          SKIP_VLC=1 scripts/desktop/build-lib-windows.sh
          dlltool -d libsimplex.dll.def -l libsimplex.lib -D libsimplex.dll

      - name: Prepare libraries
        shell: msys2 {0}
        run: |
          mkdir -p release-libs/libs
          find apps/multiplatform/common/src/commonMain/cpp/desktop/libs/windows-x86_64 -maxdepth 1 -type f -exec cp {} release-libs/libs/ \;
          cp libsimplex.lib release-libs/libs/

      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: simplex-chat-libs-windows-x86_64
          path: release-libs

  release:
    needs: [check, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: simplex-chat-libs-*
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release
          release_dir=$PWD/release
          for dir in artifacts/*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$release_dir/$name.zip" libs)
          done
          cd release
          sha256sum simplex-chat-libs-*.zip > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}-libs
          tag_name: core-${{ needs.check.outputs.version }}
          files: release/*
          token: ${{ secrets.NODEJS_REPO_TOKEN }}
