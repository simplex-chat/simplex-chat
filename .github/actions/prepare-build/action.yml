name: "Prebuilt steps for build"
description: "Reusable steps for multiple jobs"
inputs:
   ghc_ver:
     required: true
     description: "GHC version to install"
   github_ref:
     required: true
     description: "Git reference"
   cabal_ver:
     required: false
     default: 3.10.2.0
     description: "GHC version to install"
outputs:
  cabal-store:
    description: "Cabal store path"
    value: ${{ steps.setup.outputs.cabal-store }}
runs:
  using: "composite"
  steps:
    - name: Setup Haskell
      id: setup
      uses: simplex-chat/setup-haskell-action@v2
      with:
        ghc-version: ${{ inputs.ghc_ver }}
        cabal-version: ${{ inputs.cabal_ver }}

    # the pinned JDK of build-apps.yml, so the release's runtime and launcher are the reproducible ones
    - name: Setup Java
      if: startsWith(inputs.github_ref, 'refs/tags/v')
      uses: ./.github/actions/setup-corretto
