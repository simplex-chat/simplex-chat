<text x="20" y="448.0" font-size="11.5" font-weight="normal" fill="#44546a" text-anchor="start">As for badges: Pay in App Store-served builds; in store builds, Buy in browser in the US and the code button elsewhere (BadgesSupportSimplexView); both in other builds.</text>
<text x="20" y="466.0" font-size="11.5" font-weight="normal" fill="#44546a" text-anchor="start">One recovery key per device: 24 words, made at the first Register, with an account of them for each name (D41). Restore is offered on a device without them.</text>
<text x="20" y="484.0" font-size="11.5" font-weight="normal" fill="#44546a" text-anchor="start">Buy in browser: the app&#x27;s order, paid on simplex.domains (Q3). A name bought on the site: moved into the app with its name code, or shown on the profile (D44).</text>
