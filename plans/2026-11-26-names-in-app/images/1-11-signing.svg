<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="582" viewBox="0 0 1240 582" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs></defs>
<rect x="0" y="0" width="1240" height="582" fill="#ffffff"/>
<text x="20" y="32" font-size="18" font-weight="700" fill="#0b2a55" text-anchor="start">Signing with the account keys: what the core signs, and when</text>
<text x="20" y="54" font-size="12" font-weight="normal" fill="#44546a" text-anchor="start">Each order has its own account of the device&#x27;s 24 words (D41). The core signs with that account&#x27;s key the same messages the names page signs with a name code;</text>
<text x="20" y="72" font-size="12" font-weight="normal" fill="#44546a" text-anchor="start">the screens never receive a key. The core signs at the tap in the first column; nothing more is asked of the person, as after Pay for a badge.</text>
<rect x="20" y="88" width="260" height="34" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="150" y="110" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">Screen and tap</text>
<rect x="290" y="88" width="620" height="34" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="600" y="110" font-size="13" font-weight="700" fill="#7a4fc4" text-anchor="middle">Signed with the order&#x27;s account key</text>
<rect x="920" y="88" width="300" height="34" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="1070" y="110" font-size="13" font-weight="700" fill="#2c8a4a" text-anchor="middle">Sent to the store service</text>
<rect x="20" y="130" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="152" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Check your order: Pay, or</text>
<text x="30" y="168" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Register with your code</text>
<rect x="290" y="130" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="152.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">The order: the name&#x27;s hash and length, the term, the commitment,</text>
<text x="300" y="167.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">the sealed name and links, and the terms agreed for it</text>
<rect x="920" y="130" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="152.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">With the receipt or the code,</text>
<text x="930" y="167.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">in one request (R5)</text>
<rect x="20" y="192" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="214" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">The same tap</text>
<rect x="290" y="192" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="214.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">The registration and the terms acceptance, which the service</text>
<text x="300" y="229.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">sends to the chain once the commitment has waited</text>
<rect x="920" y="192" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="214.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">In the same request</text>
<rect x="20" y="254" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="276" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Registering, SimpleX names</text>
<rect x="290" y="254" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="276.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">Each read of the order&#x27;s state</text>
<rect x="920" y="254" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="276.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">Every request about an order</text>
<text x="930" y="291.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">is signed (D29)</text>
<rect x="20" y="316" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="338" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Conditions changed:</text>
<text x="30" y="354" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Accept again</text>
<rect x="290" y="316" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="338.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">The terms acceptance and the registration, again</text>
<rect x="920" y="316" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="338.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">One request</text>
<rect x="20" y="378" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="400" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">No longer available:</text>
<text x="30" y="416" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Choose another name</text>
<rect x="290" y="378" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="400.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">The selection: the new name&#x27;s fields and its registration</text>
<rect x="920" y="378" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="400.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">One request, with a new</text>
<text x="930" y="415.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">order&#x27;s checks</text>
<rect x="20" y="440" width="260" height="54" rx="10" fill="#e3eefc" stroke="#2f6fd0" stroke-width="1.6"/>
<text x="30" y="462" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Enter your recovery key:</text>
<text x="30" y="478" font-size="12" font-weight="600" fill="#1c2b3f" text-anchor="start">Get my names back</text>
<rect x="290" y="440" width="620" height="54" rx="10" fill="#efe6fb" stroke="#7a4fc4" stroke-width="1.6"/>
<text x="300" y="462.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">A find request for each account, until 20 in a row hold none</text>
<rect x="920" y="440" width="300" height="54" rx="10" fill="#e2f4e6" stroke="#2c8a4a" stroke-width="1.6"/>
<text x="930" y="462.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">One request for each</text>
<text x="930" y="477.5" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">account (Q25)</text>
<rect x="20" y="516" width="1200" height="48" rx="10" fill="#fff7d6" stroke="#b38a00" stroke-width="1.6"/>
<text x="36" y="536.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">Account keys are derived in the core when it signs, and never stored (#7684). The core signs only for the chain, contracts, namespace, term and dispute days fixed in</text>
<text x="36" y="554.0" font-size="11.5" font-weight="normal" fill="#1c2b3f" text-anchor="start">its build, and for terms whose hash it checked (R9). The 24 words are shown only on the recovery key screens (R15, R16).</text>
</svg>
