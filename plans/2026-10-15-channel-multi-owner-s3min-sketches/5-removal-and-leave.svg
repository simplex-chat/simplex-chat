<svg xmlns="http://www.w3.org/2000/svg" width="840" height="516" viewBox="0 0 840 516" role="img" aria-label="Removing an owner, and leaving. To remove owner X, owner O1 swaps its copy of the link with LSWP to revoke X, which drops X's key from the key set; then it sends x.grp.mem.del, which relays deliver first to X and then to everyone else. Relays delete their connection to X, X applies the removal and erases its keys, others hold X as departed, and the link server answers AUTH to any later LSWP or DEL by X. An owner that leaves is refused if no other current owner remains; if its own last roster was not stored or sent, it re-signs it with one more LSWP and waits up to 30 seconds for it to be sent, or the leave is refused; then it swaps to revoke itself, sends x.grp.leave and erases its keys.">
  <defs>
    <marker id="d5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <marker id="d5-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="840" height="516" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="839" height="515" fill="none" stroke="#d9d5cc"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
    <text x="20" y="30" font-size="16" font-weight="700">Removing an owner, and leaving</text>
    <text x="20" y="50" fill="#5b636e">Both land on the link first: the swap drops the owner's key at once, then the announcement follows.</text>

    <text x="20" y="78" font-weight="700" fill="#5b636e">An owner removes owner X</text>
    <line x1="150" y1="114" x2="150" y2="354" stroke="#c9ced6" stroke-dasharray="4 4"/>
    <line x1="310" y1="114" x2="310" y2="354" stroke="#c9ced6" stroke-dasharray="4 4"/>
    <line x1="470" y1="114" x2="470" y2="354" stroke="#c9ced6" stroke-dasharray="4 4"/>
    <line x1="620" y1="114" x2="620" y2="354" stroke="#c9ced6" stroke-dasharray="4 4"/>
    <line x1="760" y1="114" x2="760" y2="354" stroke="#c9ced6" stroke-dasharray="4 4"/>
    <rect x="90" y="86" width="120" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="700">Link server</text>
    <rect x="250" y="86" width="120" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="310" y="105" text-anchor="middle" font-size="13" font-weight="700">Owner O1</text>
    <rect x="410" y="86" width="120" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="470" y="105" text-anchor="middle" font-size="13" font-weight="700">Relays</text>
    <rect x="560" y="86" width="120" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="620" y="105" text-anchor="middle" font-size="13" font-weight="700">Owner X</text>
    <rect x="700" y="86" width="120" height="28" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
    <text x="760" y="105" text-anchor="middle" font-size="13" font-weight="700">Everyone else</text>

    <text x="322" y="142" font-size="11" fill="#5b636e">from its copy</text>
    <line x1="310" y1="138" x2="152" y2="138" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <text x="230" y="131" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">LSWP</tspan>: revoke X</text>
    <rect x="50" y="148" width="200" height="36" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="150" y="162" text-anchor="middle" font-size="11.5">X revoked;</text>
    <text x="150" y="177" text-anchor="middle" font-size="11.5">X's key out of the key set</text>
    <line x1="150" y1="204" x2="308" y2="204" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d5-arrow)"/>
    <text x="230" y="197" text-anchor="middle" font-weight="700">OK</text>
    <line x1="310" y1="228" x2="468" y2="228" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <text x="390" y="221" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">x.grp.mem.del X</text>
    <line x1="470" y1="250" x2="618" y2="250" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <text x="545" y="243" text-anchor="middle" font-size="11">first to X</text>
    <line x1="470" y1="272" x2="758" y2="272" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <text x="690" y="265" text-anchor="middle" font-size="11">then to everyone else</text>
    <rect x="398" y="284" width="144" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="470" y="298" text-anchor="middle" font-size="11.5">delete their</text>
    <text x="470" y="312" text-anchor="middle" font-size="11.5">connection to X</text>
    <rect x="548" y="284" width="144" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="620" y="298" text-anchor="middle" font-size="11.5">applies it,</text>
    <text x="620" y="312" text-anchor="middle" font-size="11.5">erases its keys</text>
    <rect x="704" y="284" width="112" height="34" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="760" y="305" text-anchor="middle" font-size="11.5">X departed</text>
    <line x1="150" y1="344" x2="618" y2="344" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d5-arrow-red)"/>
    <text x="390" y="337" text-anchor="middle" fill="#b42318">AUTH to any later LSWP or DEL by X</text>

    <text x="20" y="386" font-weight="700" fill="#5b636e">An owner leaves, the creator included</text>
    <rect x="20" y="400" width="200" height="70" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="120" y="431" text-anchor="middle" font-size="11.5">refused if no other</text>
    <text x="120" y="446" text-anchor="middle" font-size="11.5">current owner remains</text>
    <line x1="222" y1="435" x2="262" y2="435" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <rect x="264" y="400" width="270" height="70" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="399" y="417" text-anchor="middle" font-size="11.5">if its own last roster isn't stored</text>
    <text x="399" y="432" text-anchor="middle" font-size="11.5">or sent: re-sign it with one more LSWP</text>
    <text x="399" y="447" text-anchor="middle" font-size="11.5">and wait up to 30 s for it to be sent;</text>
    <text x="399" y="462" text-anchor="middle" font-size="11.5">if it isn't, the leave is refused</text>
    <line x1="536" y1="435" x2="572" y2="435" stroke="#24292f" stroke-width="1.5" marker-end="url(#d5-arrow)"/>
    <rect x="574" y="400" width="246" height="70" rx="5" fill="#ffffff" stroke="#8c959f"/>
    <text x="697" y="431" text-anchor="middle" font-size="11.5"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">LSWP</tspan>: revoke itself, drop its key;</text>
    <text x="697" y="446" text-anchor="middle" font-size="11.5">then <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">x.grp.leave</tspan>, erase its keys</text>

    <text x="20" y="502" fill="#5b636e">Solid arrow: request, message or next step · dashed arrow: reply · red: refused</text>
  </g>
</svg>
