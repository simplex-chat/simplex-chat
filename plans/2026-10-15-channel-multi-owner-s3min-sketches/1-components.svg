<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Components of a multi-owner channel: owner devices write the link server's single SMP queue with LSWP and read it through a proxy; relays forward owner-signed events, serve the roster to members and owners, and serve member pages to a new owner; relays and members read the link.">
  <defs>
    <marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
    <marker id="d1-arrow-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="959" height="599" fill="none" stroke="#d9d5cc"/>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
    <text x="24" y="34" font-size="17" font-weight="700">1 · Components and what each holds</text>
    <text x="24" y="56" fill="#5b636e">The link server orders every change the owners share; relays and members keep their roles of today.</text>

    <rect x="180" y="78" width="600" height="176" rx="10" fill="#fdf2e4" stroke="#b8661a" stroke-width="1.5"/>
    <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="700">Link server · the channel's one SMP queue</text>
    <line x1="420" y1="116" x2="420" y2="242" stroke="#d7b48c"/>
    <text x="198" y="134" font-weight="700">Recipient key set</text>
    <text x="198" y="154">the creator's queue key, while</text>
    <text x="198" y="172">it is an owner, + the member</text>
    <text x="198" y="190">key of every non-revoked owner</text>
    <text x="198" y="216" fill="#5b636e">may send LSWP and DEL;</text>
    <text x="198" y="234" fill="#5b636e">LSWP replaces the set atomically</text>
    <text x="438" y="134" font-weight="700">Link data, signed and encrypted</text>
    <text x="438" y="154">owners chain, relays, profile, subscriber count</text>
    <text x="438" y="172" fill="#b42318">revokedOwners: departed owners, never shrinks</text>
    <text x="438" y="190" fill="#b42318">linkVersion · roster {version, author}</text>
    <text x="438" y="208" fill="#b42318">creatorQueueKey · linkRcvId</text>
    <text x="438" y="234" fill="#5b636e">once multi-owner, written only by LSWP</text>

    <rect x="20" y="340" width="290" height="200" rx="10" fill="#e9f1fb" stroke="#2f6db5" stroke-width="1.5"/>
    <text x="165" y="364" text-anchor="middle" font-size="14" font-weight="700">Owner devices</text>
    <text x="36" y="390" font-weight="700">Creator</text>
    <text x="48" y="408">root key: signs the link data</text>
    <text x="48" y="426">queue key: authorises LSWP, DEL</text>
    <text x="48" y="444">member key: signs events</text>
    <text x="36" y="470" font-weight="700">Any other owner</text>
    <text x="48" y="488">member key: signs the link data,</text>
    <text x="48" y="506">authorises LSWP, signs events</text>
    <text x="36" y="530" fill="#5b636e">each keeps a copy of the roster</text>

    <rect x="415" y="340" width="230" height="200" rx="10" fill="#eaf6ec" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="530" y="364" text-anchor="middle" font-size="14" font-weight="700">Relays</text>
    <text x="431" y="390">members and their roles</text>
    <text x="431" y="410">serve the roster to members,</text>
    <text x="431" y="426" fill="#b42318">and to owners on request</text>
    <text x="431" y="446">forward owner-signed events</text>
    <text x="431" y="466" fill="#b42318">profile gate: linkVersion</text>
    <text x="431" y="486" fill="#b42318">member pages to a new owner</text>
    <text x="431" y="526" fill="#5b636e">cannot forge an owner</text>

    <rect x="740" y="340" width="200" height="200" rx="10" fill="#f2edfa" stroke="#6a4bb0" stroke-width="1.5"/>
    <text x="840" y="364" text-anchor="middle" font-size="14" font-weight="700">Members</text>
    <text x="754" y="390">owners and their keys,</text>
    <text x="754" y="406">from chain and commits</text>
    <text x="754" y="430">roster gate, as today</text>
    <text x="754" y="454" fill="#b42318">profile gate: linkVersion</text>
    <text x="754" y="526" fill="#5b636e">hear owners via relays</text>

    <line x1="230" y1="340" x2="230" y2="256" stroke="#b42318" stroke-width="2" marker-end="url(#d1-arrow-new)"/>
    <text x="222" y="292" text-anchor="end" fill="#b42318" font-weight="700">LSWP</text>
    <text x="222" y="308" text-anchor="end" fill="#b42318">direct, a session</text>
    <text x="222" y="324" text-anchor="end" fill="#b42318">per link</text>
    <line x1="290" y1="256" x2="290" y2="338" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d1-arrow)"/>
    <text x="298" y="292">read + hash</text>
    <text x="298" y="308">(proxied)</text>

    <line x1="530" y1="256" x2="530" y2="338" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d1-arrow)"/>
    <text x="538" y="292">read at invitation</text>
    <text x="538" y="308">and every 15 min</text>

    <line x1="760" y1="256" x2="760" y2="338" stroke="#24292f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d1-arrow)"/>
    <text x="768" y="292">read at channel open</text>
    <text x="768" y="308">and join (proxied)</text>

    <text x="362" y="392" text-anchor="middle" font-size="11">signed</text>
    <text x="362" y="406" text-anchor="middle" font-size="11">events, roster</text>
    <line x1="312" y1="416" x2="413" y2="416" stroke="#24292f" stroke-width="1.5" marker-end="url(#d1-arrow)"/>
    <text x="362" y="452" text-anchor="middle" font-size="11">forwarded</text>
    <text x="362" y="466" text-anchor="middle" font-size="11">events, roster,</text>
    <text x="362" y="480" text-anchor="middle" font-size="11" fill="#b42318">member pages</text>
    <line x1="413" y1="490" x2="312" y2="490" stroke="#24292f" stroke-width="1.5" marker-end="url(#d1-arrow)"/>

    <text x="692" y="416" text-anchor="middle" font-size="11">forwarded</text>
    <text x="692" y="430" text-anchor="middle" font-size="11">events, roster</text>
    <line x1="647" y1="440" x2="738" y2="440" stroke="#24292f" stroke-width="1.5" marker-end="url(#d1-arrow)"/>

    <text x="24" y="572" fill="#5b636e">Solid arrow: write or message · dashed arrow: read · red: new in this plan. Every owner writes with credentials built for each write.</text>
  </g>
</svg>
