t-size="30.0" font-weight="600" fill="#0D0E12" text-anchor="middle">Payment received</ns0:text><ns0:text x="440.0" y="244.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17.0" fill="#3F484B" text-anchor="middle">Waiting for the card network to confirm.</ns0:text><ns0:rect x="160.0" y="278.0" width="560.0" height="72.0" rx="10.0" fill="#fff8e6" stroke="#f0dcae" stroke-width="1.0" /><ns0:text x="184.0" y="310.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16.0" font-weight="600" fill="#8a6100">Still processing</ns0:text><ns0:text x="184.0" y="330.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.0" fill="#8a6100">This usually takes a few seconds. The page updates itself.</ns0:text><ns0:text x="440.0" y="384.0" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" fill="#6B7785" text-anchor="middle">If nothing happens for 15 minutes, we stop waiting</ns0:text><ns0:text x="440.0" y="404.3" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" fill="#6B7785" text-anchor="middle">and show you what to do next.</ns0:text><ns0:line x1="160.0" y1="434.5" x2="720.0" y2="434.5" stroke="#DCE4EE" stroke-width="1.0" /><ns0:text x="440.0" y="462.5" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.0" fill="#0053D0" text-anchor="middle">simplex.chat/contact</ns0:text></ns0:g></ns0:svg>