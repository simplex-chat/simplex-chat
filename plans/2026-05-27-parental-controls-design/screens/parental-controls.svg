<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="930" viewBox="0 0 1250 930" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#000000">
  <title>The parental controls screen: before a PIN, setup, and on</title>
  <defs>
    <g id="i-personplus" fill="none" stroke="#8a8a8e" stroke-width="1.6"><circle cx="-2.5" cy="-4" r="4"/><path d="M-10,9 C-10,3 5,3 5,9"/><path d="M7,-6 V0 M4,-3 H10"/></g>
    <g id="i-person2" fill="none" stroke="#8a8a8e" stroke-width="1.6"><circle cx="-3.5" cy="-4" r="3.6"/><path d="M-10,9 C-10,3 3,3 3,9"/><circle cx="5" cy="-4.5" r="3"/><path d="M5.5,2.5 C9,2.5 10.5,5 10.5,8"/></g>
    <g id="i-search" fill="none" stroke="#8a8a8e" stroke-width="1.8"><circle cx="-1.5" cy="-1.5" r="5.8"/><path d="M2.8,2.8 L8,8"/></g>
    <g id="i-phone" fill="none" stroke="#8a8a8e" stroke-width="1.6"><path d="M-7,-8 L-3.5,-8 L-1.5,-3.5 L-4,-1.5 C-2.5,1.5 -0.5,3.5 2,4.5 L4,2 L8.5,4 L8.5,7.5 C8.5,8.5 7.5,9 6.5,9 C-2,8 -8.5,1.5 -9,-6.5 C-9,-7.5 -8,-8 -7,-8 Z"/></g>
    <g id="i-clip" fill="none" stroke="#8a8a8e" stroke-width="1.6"><path d="M4,-3 L-3,4.5 C-4.5,6 -7,6 -8,4.5 C-9,3 -8.5,1 -7,-0.5 L1.5,-9 C3.5,-11 6.5,-11 8,-9 C9.5,-7 9,-4.5 7.5,-3 L-1,5.5"/></g>
    <g id="i-mic" fill="none" stroke="#8a8a8e" stroke-width="1.6"><rect x="-3.5" y="-9" width="7" height="12" rx="3.5"/><path d="M-7,-1 C-7,4.5 7,4.5 7,-1 M0,4.5 V9 M-3.5,9 H3.5"/></g>
    <g id="i-photo" fill="none" stroke="#8a8a8e" stroke-width="1.6"><rect x="-9" y="-7" width="18" height="14" rx="2.5"/><path d="M-7,5 L-2,0 L2,3.5 L4.5,1 L7.5,4.5"/><circle cx="3.5" cy="-2.5" r="1.4"/></g>
    <g id="t-on"><rect width="51" height="31" rx="15.5" fill="#34c759"/><circle cx="35.5" cy="15.5" r="13.5" fill="#ffffff"/></g>
    <g id="t-off"><rect width="51" height="31" rx="15.5" fill="#e9e9eb"/><circle cx="15.5" cy="15.5" r="13.5" fill="#ffffff" stroke="#d1d1d6" stroke-width="0.5"/></g>
  </defs>
  <rect width="1250" height="930" fill="#ffffff"/>

  <text x="0" y="22" font-size="15" font-weight="600" fill="#162120">1. Before a PIN is set</text>
  <text x="430" y="22" font-size="15" font-weight="600" fill="#162120">2. Setup, after the PIN, with the defaults</text>
  <text x="860" y="22" font-size="15" font-weight="600" fill="#162120">3. On, opened with the PIN</text>

  <g transform="translate(0,36)">
    <rect width="390" height="540" rx="24" fill="#f2f2f7" stroke="#17708a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="16" y="36" font-size="17" fill="#0088ff">‹ Your privacy</text>
    <text x="20" y="84" font-size="32" font-weight="700">Parental controls</text>
    <g font-size="16">
      <text x="20" y="130">Switch off connecting to new people,</text>
      <text x="20" y="151">groups, calls, files and media on this</text>
      <text x="20" y="172">phone. A PIN the child doesn't know</text>
      <text x="20" y="193">protects the switches.</text>
      <text x="20" y="226">The PIN never opens the child's chats,</text>
      <text x="20" y="247">contacts or groups.</text>
      <text x="20" y="280">This stops casual use: deleting the app</text>
      <text x="20" y="301">removes the controls. To prevent that, in</text>
      <text x="20" y="322">iPhone Settings: Screen Time → Content &amp;</text>
      <text x="20" y="343">Privacy Restrictions → iTunes &amp; App Store</text>
      <text x="20" y="364">Purchases → Deleting Apps → Don't Allow.</text>
    </g>
    <rect x="16" y="400" width="358" height="50" rx="12" fill="#0088ff"/>
    <text x="195" y="431" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Set parent PIN</text>
  </g>

  <g transform="translate(430,36)">
    <rect width="390" height="600" rx="24" fill="#f2f2f7" stroke="#17708a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="16" y="36" font-size="17" fill="#0088ff">‹ Your privacy</text>
    <text x="20" y="84" font-size="32" font-weight="700">Parental controls</text>
    <text x="36" y="122" font-size="13" fill="#8a8a8e">ALLOWED ON THIS PHONE</text>
    <rect x="16" y="132" width="358" height="308" rx="10" fill="#ffffff"/>
    <use href="#i-personplus" x="46" y="154"/><text x="72" y="159" font-size="17">Connecting to new people</text><use href="#t-off" x="313" y="138"/>
    <path d="M72,176 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-person2" x="46" y="198"/><text x="72" y="203" font-size="17">Groups and channels</text><use href="#t-off" x="313" y="182"/>
    <path d="M72,220 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-search" x="46" y="242"/><text x="72" y="247" font-size="17">Directory search</text><use href="#t-off" x="313" y="226"/>
    <path d="M72,264 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-phone" x="46" y="286"/><text x="72" y="291" font-size="17">Calls</text><use href="#t-on" x="313" y="270"/>
    <path d="M72,308 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-clip" x="46" y="330"/><text x="72" y="335" font-size="17">Sending files</text><use href="#t-on" x="313" y="314"/>
    <path d="M72,352 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-mic" x="46" y="374"/><text x="72" y="379" font-size="17">Voice messages</text><use href="#t-on" x="313" y="358"/>
    <path d="M72,396 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-photo" x="46" y="418"/><text x="72" y="423" font-size="17">Receiving files and media</text><use href="#t-on" x="313" y="402"/>
    <text x="36" y="460" font-size="13" fill="#8a8a8e">Switched off on every chat profile.</text>
    <text x="36" y="478" font-size="13" fill="#8a8a8e">Connecting and joining groups offer "Allow once".</text>
    <rect x="16" y="510" width="358" height="50" rx="12" fill="#0088ff"/>
    <text x="195" y="541" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Turn on parental controls</text>
  </g>

  <g transform="translate(860,36)">
    <rect width="390" height="860" rx="24" fill="#f2f2f7" stroke="#17708a" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="16" y="36" font-size="17" fill="#0088ff">‹ Your privacy</text>
    <text x="20" y="84" font-size="32" font-weight="700">Parental controls</text>
    <text x="36" y="122" font-size="13" fill="#8a8a8e">ALLOWED ON THIS PHONE</text>
    <rect x="16" y="132" width="358" height="308" rx="10" fill="#ffffff"/>
    <use href="#i-personplus" x="46" y="154"/><text x="72" y="159" font-size="17">Connecting to new people</text><use href="#t-off" x="313" y="138"/>
    <path d="M72,176 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-person2" x="46" y="198"/><text x="72" y="203" font-size="17">Groups and channels</text><use href="#t-off" x="313" y="182"/>
    <path d="M72,220 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-search" x="46" y="242"/><text x="72" y="247" font-size="17">Directory search</text><use href="#t-off" x="313" y="226"/>
    <path d="M72,264 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-phone" x="46" y="286"/><text x="72" y="291" font-size="17">Calls</text><use href="#t-off" x="313" y="270"/>
    <path d="M72,308 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-clip" x="46" y="330"/><text x="72" y="335" font-size="17">Sending files</text><use href="#t-on" x="313" y="314"/>
    <path d="M72,352 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-mic" x="46" y="374"/><text x="72" y="379" font-size="17">Voice messages</text><use href="#t-on" x="313" y="358"/>
    <path d="M72,396 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <use href="#i-photo" x="46" y="418"/><text x="72" y="423" font-size="17">Receiving files and media</text><use href="#t-off" x="313" y="402"/>
    <text x="36" y="460" font-size="13" fill="#8a8a8e">Switched off on every chat profile.</text>
    <text x="36" y="478" font-size="13" fill="#8a8a8e">Connecting and joining groups offer "Allow once".</text>

    <text x="36" y="516" font-size="13" fill="#8a8a8e">ALWAYS ALLOWED</text>
    <rect x="16" y="526" width="358" height="104" rx="10" fill="#ffffff"/>
    <circle cx="50" cy="552" r="18" fill="#c7c7cc"/><text x="50" y="558" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">M</text>
    <text x="80" y="558" font-size="17">Mum</text>
    <path d="M80,578 H374" stroke="#c6c6c8" stroke-width="0.5"/>
    <circle cx="50" cy="604" r="18" fill="#c7c7cc"/><text x="50" y="610" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">G</text>
    <text x="80" y="610" font-size="17">Grandma Elisabeth-Marga…</text>
    <text x="36" y="650" font-size="13" fill="#8a8a8e">Calls, files, voice and media always work with</text>
    <text x="36" y="668" font-size="13" fill="#8a8a8e">these contacts of your current profile <tspan font-weight="700">Anna</tspan>.</text>
    <text x="36" y="686" font-size="13" fill="#8a8a8e">Add a contact on its page. Tap one to remove it.</text>

    <rect x="16" y="714" width="358" height="44" rx="10" fill="#ffffff"/>
    <text x="36" y="741" font-size="17" fill="#0088ff">Change parent PIN</text>
    <rect x="16" y="786" width="358" height="44" rx="10" fill="#ffffff"/>
    <text x="36" y="813" font-size="17" fill="#ff3b30">Turn off parental controls</text>
  </g>

  <text x="0" y="918" font-size="12" fill="#56625f">Dashed outline: a new screen. A switch that is on allows the feature. The Always allowed list is hidden while calls, files, voice and media are all on.</text>
</svg>
