<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Subscription states: Apple status 1 and Play active or paused map to renewing or cancelled by auto-renew; Apple 3 and 4 and Play grace and hold to billingRetry; Apple 2 and 5 and Play expired, pending purchase canceled or HTTP 410 to ended. Each state sets the Your badge row and a chat-list banner: renews soon for annual plans, subscription cancelled, payment problem, and subscription ended once retired.">
  <defs>
    <marker id="s-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
  </defs>
  <rect width="980" height="600" fill="#f7f8fb"/>

  <text x="24" y="36" font-size="18" font-weight="600" fill="#1a2030">Subscription states and what each shows</text>
  <text x="24" y="57" font-size="12.5" fill="#5b6577">The client keeps the store's state as last observed (badge_purchases.subscription_status); the alert comes from it and paidThrough.</text>

  <g font-size="12" font-weight="600" fill="#334155">
    <text x="24" y="90">The store says</text>
    <text x="474" y="90" text-anchor="middle">State on the client</text>
    <text x="588" y="90">What the user sees</text>
  </g>

  <!-- row 1: renewing -->
  <rect x="24" y="102" width="932" height="74" rx="8" fill="#ffffff" stroke="#d9dde5"/>
  <text x="38" y="128" font-size="11.5" fill="#0b5cbf">Apple: status 1, auto-renew on</text>
  <text x="38" y="148" font-size="11.5" fill="#11713f">Play: active or paused, auto-renew on</text>
  <line x1="372" y1="139" x2="402" y2="139" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <rect x="404" y="124" width="140" height="30" rx="15" fill="#e7f4ec" stroke="#8cc6a3"/>
  <text x="474" y="144" font-size="12.5" font-weight="600" fill="#11713f" text-anchor="middle">renewing</text>
  <line x1="546" y1="139" x2="576" y2="139" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <text x="588" y="119" font-size="11.5" fill="#1a2030">Your badge: “Renews {date} · {price}”, then “Renewing”</text>
  <text x="588" y="134" font-size="11.5" fill="#1a2030">past paidThrough, until the store charges</text>
  <text x="588" y="149" font-size="11.5" fill="#1a2030">Banner, annual plans only, 3 days before:</text>
  <text x="588" y="164" font-size="11.5" fill="#1a2030">“Your badge renews soon”</text>

  <!-- row 2: cancelled -->
  <rect x="24" y="186" width="932" height="74" rx="8" fill="#ffffff" stroke="#d9dde5"/>
  <text x="38" y="212" font-size="11.5" fill="#0b5cbf">Apple: status 1, auto-renew off</text>
  <text x="38" y="232" font-size="11.5" fill="#11713f">Play: active or paused, auto-renew off; canceled</text>
  <line x1="372" y1="223" x2="402" y2="223" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <rect x="404" y="208" width="140" height="30" rx="15" fill="#eef1f5" stroke="#b9c1cf"/>
  <text x="474" y="228" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">cancelled</text>
  <line x1="546" y1="223" x2="576" y2="223" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <text x="588" y="207" font-size="11.5" fill="#1a2030">Your badge: “Ends {date}”, then “Ended”</text>
  <text x="588" y="225" font-size="11.5" fill="#1a2030">Banner while paid: “Subscription cancelled”,</text>
  <text x="588" y="243" font-size="11.5" fill="#1a2030">“Your badge stays until {date}”</text>

  <!-- row 3: billingRetry -->
  <rect x="24" y="270" width="932" height="74" rx="8" fill="#ffffff" stroke="#d9dde5"/>
  <text x="38" y="296" font-size="11.5" fill="#0b5cbf">Apple: status 3 (billing retry), 4 (grace)</text>
  <text x="38" y="316" font-size="11.5" fill="#11713f">Play: in grace period, on hold</text>
  <line x1="372" y1="307" x2="402" y2="307" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <rect x="404" y="292" width="140" height="30" rx="15" fill="#fff4e0" stroke="#e7c48a"/>
  <text x="474" y="312" font-size="12.5" font-weight="600" fill="#9a5400" text-anchor="middle">billingRetry</text>
  <line x1="546" y1="307" x2="576" y2="307" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <text x="588" y="291" font-size="11.5" fill="#1a2030">Your badge: “Payment problem”</text>
  <text x="588" y="309" font-size="11.5" fill="#1a2030">Banner, as a warning: “Badge payment problem”</text>
  <text x="588" y="327" font-size="11.5" fill="#5b6577">badge kept, no credential, asked again daily</text>

  <!-- row 4: ended -->
  <rect x="24" y="354" width="932" height="74" rx="8" fill="#ffffff" stroke="#d9dde5"/>
  <text x="38" y="380" font-size="11.5" fill="#0b5cbf">Apple: status 2 (expired), 5 (revoked)</text>
  <text x="38" y="400" font-size="11.5" fill="#11713f">Play: expired, pending purchase canceled, HTTP 410</text>
  <line x1="372" y1="391" x2="402" y2="391" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <rect x="404" y="376" width="140" height="30" rx="15" fill="#fdecea" stroke="#e8a59f"/>
  <text x="474" y="396" font-size="12.5" font-weight="600" fill="#b3261e" text-anchor="middle">ended</text>
  <line x1="546" y1="391" x2="576" y2="391" stroke="#5b6577" stroke-width="1.4" marker-end="url(#s-arr)"/>
  <text x="588" y="375" font-size="11.5" fill="#1a2030">From the service: badge retired, banner</text>
  <text x="588" y="393" font-size="11.5" fill="#1a2030">“Your subscription ended”. From the device</text>
  <text x="588" y="411" font-size="11.5" fill="#1a2030">only the row changes: “Ended”</text>

  <!-- notes -->
  <rect x="24" y="446" width="932" height="134" rx="8" fill="#eef1f5"/>
  <g font-size="12" fill="#1a2030">
    <text x="40" y="468">Writers: the service, at the credit and in any answer past the coverage the client asserted; and the device's report after each</text>
    <text x="40" y="485">sweep, which never replaces billingRetry or ended with renewing (Play lists a subscription in its grace period as auto-renewing).</text>
    <text x="40" y="508">No state yet, or one this version does not know: shown as renewing, no banner. Play's pending subscription: payment_pending, no state.</text>
    <text x="40" y="531">Also retired without ended: once 67 days have passed since the first answer that renewed nothing, again “Your subscription ended”.</text>
    <text x="40" y="554">One banner at a time, first that applies: subscription ended, payment problem, renewal failed, cancelled, renews soon.</text>
    <text x="40" y="571" fill="#5b6577">“Badge renewal failed” (issue_failed) shows a failure that cannot clear, or any once the shown credential has expired.</text>
  </g>
</svg>
