<svg xmlns="http://www.w3.org/2000/svg" width="980" height="864" viewBox="0 0 980 864" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Restore on another device or profile: the app hands the store's current subscriptions to core as restored; core refuses while the profile shows a badge, otherwise holds each as a move under fresh keys of the active profile and sends transferBadge; the service asks the store, refuses an older App Store transaction, a payment moved too recently or a charge it could not credit, and otherwise ends the old purchase, moves the payment and credits the new key, issuing its month. The old key is answered ended from then on.">
  <defs>
    <marker id="m-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/></marker>
  </defs>
  <rect width="980" height="864" fill="#f7f8fb"/>

  <text x="24" y="36" font-size="18" font-weight="600" fill="#1a2030">Restore on another device or profile</text>
  <text x="24" y="57" font-size="12.5" fill="#5b6577">Restore moves a store subscription to fresh keys of the active profile; from then on the service answers the old key ended.</text>

  <!-- lifelines -->
  <line x1="130" y1="108" x2="130" y2="716" stroke="#c9cfdb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="390" y1="108" x2="390" y2="716" stroke="#c9cfdb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="650" y1="108" x2="650" y2="716" stroke="#c9cfdb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="890" y1="108" x2="890" y2="716" stroke="#c9cfdb" stroke-width="1.2" stroke-dasharray="4 4"/>

  <rect x="40" y="72" width="180" height="36" rx="8" fill="#eef1f5" stroke="#c9cfdb"/>
  <text x="130" y="95" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">App on the new device</text>
  <rect x="300" y="72" width="180" height="36" rx="8" fill="#e3f1f3" stroke="#b5dadd"/>
  <text x="390" y="95" font-size="12.5" font-weight="600" fill="#0f5f69" text-anchor="middle">Chat core</text>
  <rect x="560" y="72" width="180" height="36" rx="8" fill="#eceefe" stroke="#c5c8f0"/>
  <text x="650" y="95" font-size="12.5" font-weight="600" fill="#3a3fa6" text-anchor="middle">Badge service</text>
  <rect x="800" y="72" width="170" height="36" rx="8" fill="#f1f3f7" stroke="#c9cfdb"/>
  <text x="885" y="95" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">App Store or Play API</text>

  <!-- step numbers -->
  <g font-size="11" font-weight="600" fill="#8a93a6" text-anchor="middle">
    <text x="14" y="144">1</text>
    <text x="14" y="204">2</text>
    <text x="14" y="252">3</text>
    <text x="14" y="326">4</text>
    <text x="14" y="388">5</text>
    <text x="14" y="450">6</text>
    <text x="14" y="530">7</text>
    <text x="14" y="630">8</text>
    <text x="14" y="694">9</text>
  </g>

  <!-- 1 -->
  <rect x="30" y="122" width="200" height="54" rx="6" fill="#f3f5f8" stroke="#cfd5df"/>
  <text x="40" y="137" font-size="11.5" fill="#1a2030">Support SimpleX → Restore</text>
  <text x="40" y="152" font-size="11.5" fill="#1a2030">hands over the store's current</text>
  <text x="40" y="167" font-size="11.5" fill="#1a2030">subscriptions as restored</text>

  <!-- 2 -->
  <line x1="130" y1="200" x2="388" y2="200" stroke="#5b6577" stroke-width="1.4" marker-end="url(#m-arr)"/>
  <text x="260" y="194" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/_badge purchase … restored</text>
  <text x="260" y="215" font-size="11" fill="#5b6577" text-anchor="middle">one per transaction</text>

  <!-- 3 -->
  <rect x="275" y="230" width="230" height="68" rx="6" fill="#eef7f8" stroke="#b5dadd"/>
  <text x="285" y="245" font-size="11.5" fill="#1a2030">this profile shows a badge?</text>
  <text x="285" y="260" font-size="11.5" fill="#1a2030">→ refused: a badge is active</text>
  <text x="285" y="275" font-size="11.5" fill="#1a2030">else held as a move, under</text>
  <text x="285" y="290" font-size="11.5" fill="#1a2030">fresh keys of this profile</text>

  <!-- 4 -->
  <line x1="390" y1="322" x2="648" y2="322" stroke="#5b6577" stroke-width="1.4" marker-end="url(#m-arr)"/>
  <text x="520" y="316" font-size="11" fill="#334155" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">transferBadge {masterKey, payment}</text>
  <text x="520" y="337" font-size="11" fill="#5b6577" text-anchor="middle">signed by the new purchase key</text>

  <!-- 5 -->
  <rect x="515" y="352" width="270" height="70" rx="6" fill="#f3f4ff" stroke="#c5c8f0"/>
  <text x="525" y="367" font-size="11.5" fill="#1a2030">purchase lane; the key holds no</text>
  <text x="525" y="382" font-size="11.5" fill="#1a2030">purchase yet, else bad_request;</text>
  <text x="525" y="397" font-size="11.5" fill="#1a2030">asked &lt; 1 h ago → payment_pending;</text>
  <text x="525" y="412" font-size="11.5" fill="#1a2030">Play: ≤ 300 checks a minute</text>

  <!-- 6 -->
  <line x1="650" y1="446" x2="888" y2="446" stroke="#5b6577" stroke-width="1.4" marker-end="url(#m-arr)"/>
  <text x="770" y="440" font-size="11.5" fill="#1a2030" text-anchor="middle">the subscription's status</text>
  <line x1="890" y1="478" x2="652" y2="478" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#m-arr)"/>
  <text x="770" y="472" font-size="11.5" fill="#1a2030" text-anchor="middle">state and latest charge</text>

  <!-- 7 -->
  <rect x="515" y="494" width="270" height="84" rx="6" fill="#fff4e0" stroke="#e7c48a"/>
  <text x="525" y="509" font-size="11.5" fill="#1a2030">App Store, not the latest transaction</text>
  <text x="525" y="524" font-size="11.5" fill="#1a2030">→ payment_pending. The key it last</text>
  <text x="525" y="539" font-size="11.5" fill="#1a2030">moved from holds an unexpired</text>
  <text x="525" y="554" font-size="11.5" fill="#1a2030">credential → transfer_limited. A charge</text>
  <text x="525" y="569" font-size="11.5" fill="#1a2030">it can't credit → as for a first purchase</text>

  <!-- 8 -->
  <rect x="515" y="596" width="270" height="70" rx="6" fill="#e7f4ec" stroke="#8cc6a3"/>
  <text x="525" y="611" font-size="11.5" fill="#1a2030">one transaction: old purchase lapsed,</text>
  <text x="525" y="626" font-size="11.5" fill="#1a2030">debited transferOut {new key}; the</text>
  <text x="525" y="641" font-size="11.5" fill="#1a2030">payment moves to the new purchase,</text>
  <text x="525" y="656" font-size="11.5" fill="#1a2030">credited from its period start; issue</text>

  <!-- 9 -->
  <line x1="650" y1="690" x2="392" y2="690" stroke="#5b6577" stroke-width="1.4" marker-end="url(#m-arr)"/>
  <text x="520" y="684" font-size="11.5" fill="#1a2030" text-anchor="middle">badgeCredential, subscription</text>
  <text x="520" y="705" font-size="11" fill="#5b6577" text-anchor="middle">shown and sent to contacts at once</text>

  <!-- footer -->
  <rect x="24" y="726" width="932" height="118" rx="8" fill="#eef1f5"/>
  <text x="40" y="746" font-size="12" fill="#1a2030">The device it left keeps the credential it holds; its next request is answered ended with no credential, and it retires the badge.</text>
  <text x="40" y="763" font-size="12" fill="#1a2030">The service now links the two purchase keys, as the same store transaction funds both; it still links neither to a profile.</text>
  <text x="40" y="780" font-size="12" fill="#1a2030">Whoever holds a store receipt can move the badge to their own keys: an App Store receipt until the store charges again, a Play token</text>
  <text x="40" y="797" font-size="12" fill="#1a2030">for the subscription's life. A payment moves again only once the last credential of the key it moved from has expired, up to 39 days,</text>
  <text x="40" y="814" font-size="12" fill="#1a2030">so each paid month stays with at most two keys. The first Restore refused as limited may say nothing; the next says why.</text>
  <text x="40" y="831" font-size="12" fill="#1a2030">Card, crypto and code badges don't move.</text>
</svg>
