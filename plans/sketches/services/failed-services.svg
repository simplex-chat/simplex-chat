<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Proposed: one of two directories failed (search field at the bottom)</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.tb{font-size:14px;fill:#111;font-weight:700}.s{font-size:11px;fill:#6e6e73}.b{font-size:14px;fill:#0071e3}.av{fill:#d9d9de}.sep{stroke:#e3e3e8}.bar{font-size:15px;fill:#111;font-weight:600}.chg{fill:none;stroke:#b26a00;stroke-width:2.5}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="18" y="180">↻ [Your directory]: search failed,</text>
<text class="b" x="34" y="198">tap to retry</text>
<rect class="chg" x="8" y="160" width="284" height="48" rx="8"/>
<line class="sep" x1="12" y1="212" x2="288" y2="212"/>
<circle class="av" cx="34" cy="246" r="18"/>
<text class="tb" x="62" y="238">#cinews_weekly</text>
<text class="s" x="62" y="254">CI news weekly</text>
<text class="s" x="62" y="268">2 members</text>
<text class="b" x="282" y="250" text-anchor="end">Open</text>
<line class="sep" x1="12" y1="284" x2="288" y2="284"/>
<circle class="av" cx="34" cy="318" r="18"/>
<text class="tb" x="62" y="310">#cinews</text>
<text class="s" x="62" y="326">CI news channel</text>
<text class="s" x="62" y="340">2 subscribers</text>
<text class="b" x="282" y="322" text-anchor="end">Open</text>
<line class="sep" x1="12" y1="356" x2="288" y2="356"/>
<circle class="av" cx="34" cy="390" r="18"/>
<text class="t" x="62" y="386">cinews_digest</text>
<text class="s" x="62" y="402">[last message]</text>
<text class="b" x="18" y="448">Connect to cinews.testing</text>
<rect class="g" x="12" y="466" width="276" height="34" rx="10"/>
<text class="t" x="24" y="488">cinews</text>
<circle class="av" cx="30" cy="530" r="12"/>
<text class="bar" x="150" y="535" text-anchor="middle">Chats</text>
</svg>
