<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Proposed: the enable alert names every directory in use</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.s{font-size:11px;fill:#6e6e73}.b{font-size:14px;fill:#0071e3}.av{fill:#d9d9de}.sep{stroke:#e3e3e8}.bar{font-size:15px;fill:#111;font-weight:600}.scrim{fill:#000;fill-opacity:.38}.al{fill:#f2f2f7}.at{font-size:15px;font-weight:600;fill:#111}.am{font-size:12px;fill:#111}.ab{font-size:15px;fill:#0071e3}.abb{font-size:15px;fill:#0071e3;font-weight:600}.chg{fill:none;stroke:#b26a00;stroke-width:2.5}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<circle class="av" cx="34" cy="378" r="18"/>
<text class="t" x="62" y="374">cinews_digest</text>
<text class="s" x="62" y="390">[last message]</text>
<text class="b" x="18" y="424">Connect to cinews.testing</text>
<text class="b" x="18" y="452">Search in Directory</text>
<rect class="g" x="12" y="466" width="276" height="34" rx="10"/>
<text class="t" x="24" y="488">cinews</text>
<circle class="av" cx="30" cy="530" r="12"/>
<text class="bar" x="150" y="535" text-anchor="middle">Chats</text>
<rect class="scrim" x="1" y="1" width="298" height="558" rx="34"/>
<rect class="al" x="30" y="140" width="240" height="196" rx="14"/>
<text class="at" x="150" y="170" text-anchor="middle">Enable Directory search?</text>
<text class="am" x="150" y="196" text-anchor="middle">Search text is sent to SimpleX</text>
<text class="am" x="150" y="212" text-anchor="middle">Directory and [Your directory]</text>
<text class="am" x="150" y="228" text-anchor="middle">[marked as yours], each search</text>
<text class="am" x="150" y="244" text-anchor="middle">separately and without your</text>
<text class="am" x="150" y="260" text-anchor="middle">profile.</text>
<rect class="chg" x="40" y="182" width="220" height="86" rx="6"/>
<line class="sep" x1="30" y1="290" x2="270" y2="290"/>
<line class="sep" x1="150" y1="290" x2="150" y2="336"/>
<text class="abb" x="90" y="318" text-anchor="middle">Cancel</text>
<text class="ab" x="210" y="318" text-anchor="middle">Enable</text>
</svg>
