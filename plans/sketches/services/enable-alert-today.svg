<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Today: the enable alert names one directory</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.s{font-size:11px;fill:#6e6e73}.b{font-size:14px;fill:#0071e3}.av{fill:#d9d9de}.sep{stroke:#e3e3e8}.scrim{fill:#000;fill-opacity:.38}.al{fill:#f2f2f7}.at{font-size:15px;font-weight:600;fill:#111}.am{font-size:12px;fill:#111}.ab{font-size:15px;fill:#0071e3}.abb{font-size:15px;fill:#0071e3;font-weight:600}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<rect class="g" x="12" y="60" width="276" height="34" rx="10"/>
<text class="t" x="24" y="82">cinews</text>
<circle class="av" cx="34" cy="128" r="18"/>
<text class="t" x="62" y="124">cinews_digest</text>
<text class="s" x="62" y="140">[last message]</text>
<text class="b" x="18" y="184">Connect to cinews.testing</text>
<text class="b" x="18" y="216">Search in Directory</text>
<rect class="scrim" x="1" y="1" width="298" height="558" rx="34"/>
<rect class="al" x="30" y="200" width="240" height="164" rx="14"/>
<text class="at" x="150" y="230" text-anchor="middle">Enable Directory search?</text>
<text class="am" x="150" y="256" text-anchor="middle">Search text is sent to SimpleX</text>
<text class="am" x="150" y="272" text-anchor="middle">Directory, each search separately</text>
<text class="am" x="150" y="288" text-anchor="middle">and without your profile.</text>
<line class="sep" x1="30" y1="318" x2="270" y2="318"/>
<line class="sep" x1="150" y1="318" x2="150" y2="364"/>
<text class="abb" x="90" y="346" text-anchor="middle">Cancel</text>
<text class="ab" x="210" y="346" text-anchor="middle">Enable</text>
</svg>
