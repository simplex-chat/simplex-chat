<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Today: an operator's servers</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.s{font-size:11px;fill:#6e6e73}.h{font-size:22px;font-weight:700;fill:#111}.b{font-size:14px;fill:#0071e3}.sep{stroke:#e3e3e8}.ok{font-size:14px;fill:#248a3d;font-weight:700}.on{fill:#34c759}.kn{fill:#fff}.ch{font-size:14px;fill:#c4c4c7}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="14" y="52">‹ Network &amp; servers</text>
<text class="h" x="16" y="86">SimpleX Chat servers</text>
<text class="s" x="28" y="118">OPERATOR</text>
<rect class="g" x="12" y="124" width="276" height="88" rx="10"/>
<text class="s" x="26" y="152">[SimpleX Chat logo]</text>
<text class="ch" x="272" y="152">›</text>
<line class="sep" x1="26" y1="168" x2="288" y2="168"/>
<text class="t" x="26" y="195">Use servers</text>
<rect class="on" x="232" y="178" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="190" r="10"/>
<text class="s" x="28" y="240">CHAT RELAYS</text>
<rect class="g" x="12" y="246" width="276" height="44" rx="10"/>
<text class="ok" x="26" y="273">✓</text>
<text class="t" x="46" y="273">[preset relay]</text>
<text class="ch" x="272" y="273">›</text>
<text class="s" x="28" y="306">Chat relays forward messages in channels</text>
<text class="s" x="28" y="320">you create.</text>
<text class="s" x="28" y="350">USE FOR MESSAGES</text>
<rect class="g" x="12" y="356" width="276" height="132" rx="10"/>
<text class="t" x="26" y="383">To receive</text>
<rect class="on" x="232" y="366" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="378" r="10"/>
<line class="sep" x1="26" y1="400" x2="288" y2="400"/>
<text class="t" x="26" y="427">For private routing</text>
<rect class="on" x="232" y="410" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="422" r="10"/>
<line class="sep" x1="26" y1="444" x2="288" y2="444"/>
<text class="t" x="26" y="471">To resolve names</text>
<rect class="on" x="232" y="454" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="466" r="10"/>
</svg>
