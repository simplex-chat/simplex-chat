<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Proposed: Test service fails</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.p{font-size:14px;fill:#b0b0b5}.s{font-size:11px;fill:#6e6e73}.h{font-size:22px;font-weight:700;fill:#111}.b{font-size:14px;fill:#0071e3}.sep{stroke:#e3e3e8}.scrim{fill:#000;fill-opacity:.38}.al{fill:#f2f2f7}.at{font-size:15px;font-weight:600;fill:#111}.am{font-size:12px;fill:#111}.ab{font-size:15px;fill:#0071e3;font-weight:600}.new{fill:none;stroke:#1e8a55;stroke-width:2.5}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="14" y="52">‹ Back</text>
<text class="h" x="16" y="86">New service</text>
<text class="s" x="28" y="118">YOUR SERVICE ADDRESS</text>
<rect class="g" x="12" y="124" width="276" height="72" rx="10"/>
<text class="t" x="26" y="150">https://[server]/a#[address]</text>
<text class="s" x="28" y="220">YOUR SERVICE NAME</text>
<rect class="g" x="12" y="226" width="276" height="44" rx="10"/>
<text class="p" x="26" y="253">Enter service name…</text>
<text class="s" x="28" y="294">USE SERVICE</text>
<rect class="g" x="12" y="300" width="276" height="44" rx="10"/>
<text class="b" x="26" y="327">Test service</text>
<rect class="scrim" x="1" y="1" width="298" height="558" rx="34"/>
<rect class="al" x="36" y="200" width="228" height="140" rx="14"/>
<text class="at" x="150" y="230" text-anchor="middle">Service test failed!</text>
<text class="am" x="150" y="254" text-anchor="middle">This address doesn't answer</text>
<text class="am" x="150" y="270" text-anchor="middle">service requests.</text>
<line class="sep" x1="36" y1="294" x2="264" y2="294"/>
<text class="ab" x="150" y="322" text-anchor="middle">OK</text>
<rect class="new" x="32" y="196" width="236" height="148" rx="16"/>
</svg>
