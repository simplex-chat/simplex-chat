<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Proposed, later: turning usage statistics on</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.s{font-size:11px;fill:#6e6e73}.h{font-size:22px;font-weight:700;fill:#111}.b{font-size:14px;fill:#0071e3}.sep{stroke:#e3e3e8}.scrim{fill:#000;fill-opacity:.38}.al{fill:#f2f2f7}.at{font-size:15px;font-weight:600;fill:#111}.am{font-size:12px;fill:#111}.amb{font-size:12px;fill:#111;font-weight:700}.ab{font-size:15px;fill:#0071e3}.abb{font-size:15px;fill:#0071e3;font-weight:600}.new{fill:none;stroke:#1e8a55;stroke-width:2.5}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="14" y="52">‹ Settings</text>
<text class="h" x="16" y="86">Privacy &amp; security</text>
<rect class="scrim" x="1" y="1" width="298" height="558" rx="34"/>
<rect class="al" x="30" y="190" width="240" height="190" rx="14"/>
<text class="at" x="150" y="220" text-anchor="middle">Share usage statistics?</text>
<text class="am" x="150" y="246" text-anchor="middle">Once a day your app sends SimpleX</text>
<text class="am" x="150" y="262" text-anchor="middle">Chat statistics this report:</text>
<text class="amb" x="150" y="282" text-anchor="middle">2026-10-22 · iOS · 7.1</text>
<text class="am" x="150" y="302" text-anchor="middle">No profile or identifier is sent.</text>
<line class="sep" x1="30" y1="334" x2="270" y2="334"/>
<line class="sep" x1="150" y1="334" x2="150" y2="380"/>
<text class="abb" x="90" y="362" text-anchor="middle">Cancel</text>
<text class="ab" x="210" y="362" text-anchor="middle">Share</text>
<rect class="new" x="26" y="186" width="248" height="198" rx="16"/>
</svg>
