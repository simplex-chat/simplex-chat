<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Today: New chat relay, the screen New service is modelled on</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.p{font-size:14px;fill:#b0b0b5}.s{font-size:11px;fill:#6e6e73}.h{font-size:22px;font-weight:700;fill:#111}.b{font-size:14px;fill:#0071e3}.sep{stroke:#e3e3e8}.on{fill:#34c759}.kn{fill:#fff}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="14" y="52">‹ Back</text>
<text class="h" x="16" y="86">New chat relay</text>
<text class="s" x="28" y="118">YOUR RELAY ADDRESS</text>
<rect class="g" x="12" y="124" width="276" height="96" rx="10"/>
<text class="t" x="26" y="150">https://[server]/r#[relay address]</text>
<text class="s" x="28" y="244">YOUR RELAY NAME</text>
<rect class="g" x="12" y="250" width="276" height="44" rx="10"/>
<text class="p" x="26" y="277">Enter relay name…</text>
<text class="s" x="28" y="310">Test relay to retrieve its name.</text>
<text class="s" x="28" y="340">USE RELAY</text>
<rect class="g" x="12" y="346" width="276" height="88" rx="10"/>
<text class="b" x="26" y="373">Test relay</text>
<line class="sep" x1="26" y1="390" x2="288" y2="390"/>
<text class="t" x="26" y="417">Use for new channels</text>
<rect class="on" x="232" y="400" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="412" r="10"/>
</svg>
