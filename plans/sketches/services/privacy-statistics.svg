<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" width="300" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<title>Proposed, later: Privacy settings with Share usage statistics</title>
<style>.ph{fill:#f2f2f7;stroke:#c7c7cc}.g{fill:#fff}.t{font-size:14px;fill:#111}.s{font-size:11px;fill:#6e6e73}.h{font-size:22px;font-weight:700;fill:#111}.b{font-size:14px;fill:#0071e3}.sep{stroke:#e3e3e8}.on{fill:#34c759}.off{fill:#e5e5ea}.kn{fill:#fff}.new{fill:none;stroke:#1e8a55;stroke-width:2.5}</style>
<rect class="ph" x="1" y="1" width="298" height="558" rx="34"/>
<text class="b" x="14" y="52">‹ Settings</text>
<text class="h" x="16" y="86">Privacy &amp; security</text>
<text class="s" x="28" y="118">CHATS</text>
<rect class="g" x="12" y="124" width="276" height="88" rx="10"/>
<text class="t" x="26" y="151">Directory search</text>
<rect class="on" x="232" y="134" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="146" r="10"/>
<line class="sep" x1="26" y1="168" x2="288" y2="168"/>
<text class="t" x="26" y="195">Share usage statistics</text>
<rect class="on" x="232" y="178" width="40" height="24" rx="12"/><circle class="kn" cx="260" cy="190" r="10"/>
<text class="s" x="28" y="228">Last sent today to [statistics service]</text>
<rect class="new" x="14" y="170" width="272" height="66" rx="8"/>
</svg>
