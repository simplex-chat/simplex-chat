.5" fill="#6e6e73" font-weight="400" text-anchor="start">PRESET DIRECTORY ADDRESS</text><rect x="588" y="139" width="230" height="48" rx="8" fill="#ffffff"/><text x="598.0" y="154.0" font-size="10" fill="#111111" font-weight="400" text-anchor="start">https://[server]/a#[directory address]</text><text x="602.0" y="205.0" font-size="8.5" fill="#6e6e73" font-weight="400" text-anchor="start">PRESET DIRECTORY NAME</text><rect x="588" y="210" width="230" height="28" rx="8" fill="#ffffff"/><text x="598.0" y="228.0" font-size="11" fill="#111111" font-weight="400" text-anchor="start">SimpleX Directory</text><text x="602.0" y="256.0" font-size="8.5" fill="#6e6e73" font-weight="400" text-anchor="start">USE DIRECTORY</text><rect x="588" y="261" width="230" height="56" rx="8" fill="#ffffff"/><text x="598.0" y="279.0" font-size="11" fill="#0071e3" font-weight="400" text-anchor="start">Test directory</text><line x1="598" y1="289" x2="818" y2="289" stroke="#e3e3e8"/><text x="598.0" y="307.0" font-size="11" fill="#111111" font-weight="400" text-anchor="start">Use for search</text><rect x="778" y="294.0" width="30" height="18" rx="9" fill="#34c759"/><circle cx="799" cy="303.0" r="7.5" fill="#ffffff"/></g><rect x="584.0" y="120.0" width="238.0" height="201.0" rx="5" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="10" y="550" width="16" height="11" rx="2" fill="#c0392b" fill-opacity="0.07" stroke="#c0392b" stroke-dasharray="4 2"/><text x="32" y="560" font-size="11" fill="#6e6e73">Red dashed outline: added or changed by this design. [Brackets]: placeholders on the app designer's boards. ✓: the test passed, as for</text><text x="32" y="575" font-size="11" fill="#6e6e73">chat relays. The preset directory's screen mirrors today's preset chat relay screen (titled "Chat relay"); the designer didn't draw it.</text><text x="32" y="590" font-size="11" fill="#6e6e73">Back labels as on the designer's boards.</text></svg>
